<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frameloom">
<meta name="description" content="Frameloom — a free, offline stop-motion animation studio for iPhone and Android.">
<title>Frameloom — Stop Motion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ LIBRARY ============ -->
<section id="library" class="screen active">
  <header class="lib-head">
    <div class="brand"><img src="icons/icon-192.png" alt=""><h1>Frameloom</h1></div>
    <div class="lib-actions">
      <button class="btn ghost" id="btnImportProject" title="Import a project backup (.zip)">Import</button>
      <button class="btn ghost icon" id="btnAppSettings" title="Settings">⚙︎</button>
    </div>
  </header>
  <div id="projectGrid" class="project-grid"></div>
  <button id="btnNewProject" class="fab">＋ New movie</button>
  <div id="installHint" class="install-hint hidden"></div>
</section>

<!-- ============ STUDIO ============ -->
<section id="studio" class="screen">
  <header class="studio-head">
    <button class="btn ghost icon" id="btnBack" title="Back to movies">‹</button>
    <input id="projName" class="proj-name" spellcheck="false" aria-label="Movie name">
    <div class="head-right">
      <button class="btn ghost icon" id="btnUndo" title="Undo">↶</button>
      <button class="btn ghost icon" id="btnRedo" title="Redo">↷</button>
      <button class="btn accent" id="btnExport">Export</button>
    </div>
  </header>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <video id="liveVideo" playsinline muted autoplay></video>
      <canvas id="viewCanvas"></canvas>
      <canvas id="onionCanvas"></canvas>
      <video id="refVideo" playsinline muted class="ref-layer hidden"></video>
      <img id="refImage" class="ref-layer hidden" alt="">
      <div id="gridOverlay" class="grid-overlay hidden"></div>
      <div id="flash" class="flash"></div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="stageBadge" class="stage-badge"></div>
      <div id="camMsg" class="cam-msg hidden"></div>
    </div>

    <div class="side-controls">
      <button class="side-btn" id="btnMode" title="Switch camera / playback">🎥</button>
      <button class="capture-btn" id="btnCapture" title="Capture frame (Space)"><span></span></button>
      <button class="side-btn" id="btnPlay" title="Play / pause">▶</button>
      <button class="side-btn small" id="btnFlip" title="Hold to compare with last frame">⇆</button>
    </div>
  </div>

  <div class="timeline-wrap">
    <div class="tl-info"><span id="tlPos">0 / 0</span><span id="tlTime">0.0s</span><span id="tlFps">12 fps</span></div>
    <div id="timeline" class="timeline"></div>
  </div>

  <nav class="toolbar" id="toolbar">
    <button data-panel="camera">📷<span>Camera</span></button>
    <button data-panel="onion">🧅<span>Onion</span></button>
    <button data-panel="timer">⏱<span>Timer</span></button>
    <button data-panel="edit">✂︎<span>Edit</span></button>
    <button data-panel="paint">🖌<span>Paint</span></button>
    <button data-panel="green">🟩<span>Green</span></button>
    <button data-panel="audio">🎵<span>Audio</span></button>
    <button data-panel="titles">🅃<span>Titles</span></button>
    <button data-panel="effects">✨<span>Effects</span></button>
    <button data-panel="layers">🗂<span>Layers</span></button>
    <button data-panel="import">⤓<span>Import</span></button>
    <button data-panel="remote">📡<span>Remote</span></button>
    <button data-panel="movie">⚙︎<span>Movie</span></button>
  </nav>

  <div id="panel" class="panel hidden">
    <div class="panel-head"><h2 id="panelTitle"></h2><button class="btn ghost icon" id="panelClose">✕</button></div>
    <div id="panelBody" class="panel-body"></div>
  </div>
</section>

<!-- ============ PAINT EDITOR ============ -->
<section id="paintScreen" class="screen">
  <header class="studio-head">
    <button class="btn ghost" id="paintCancel">Cancel</button>
    <div class="paint-title">Paint frame <span id="paintIdx"></span></div>
    <button class="btn accent" id="paintDone">Done</button>
  </header>
  <div class="paint-stage" id="paintStage">
    <div class="paint-inner" id="paintInner">
      <canvas id="paintBase"></canvas>
      <canvas id="paintRef"></canvas>
      <canvas id="paintLayer"></canvas>
      <canvas id="paintCursor"></canvas>
    </div>
  </div>
  <div class="paint-tools">
    <div class="row wrap" id="paintToolRow">
      <button data-tool="brush" class="tool active">🖌 Brush</button>
      <button data-tool="marker" class="tool">🖍 Marker</button>
      <button data-tool="eraser" class="tool">🩹 Eraser</button>
      <button data-tool="fill" class="tool">🪣 Fill</button>
      <button data-tool="line" class="tool">／ Line</button>
      <button data-tool="rect" class="tool">▭ Box</button>
      <button data-tool="ellipse" class="tool">◯ Oval</button>
      <button data-tool="text" class="tool">T Text</button>
      <button data-tool="magic" class="tool">✨ Magic eraser</button>
      <button data-tool="pick" class="tool">💧 Pick</button>
    </div>
    <div class="row wrap">
      <input type="color" id="paintColor" value="#ff3b6b">
      <div class="swatches" id="swatches"></div>
      <label class="mini">Size <input type="range" id="paintSize" min="1" max="120" value="12"></label>
      <label class="mini">Opacity <input type="range" id="paintAlpha" min="5" max="100" value="100"></label>
    </div>
    <div class="row wrap">
      <button class="btn" id="paintUndo">↶ Undo</button>
      <button class="btn" id="paintRedo">↷ Redo</button>
      <button class="btn" id="paintClear">Clear drawing</button>
      <label class="mini"><input type="checkbox" id="paintShowRef"> Show reference</label>
      <label class="mini"><input type="checkbox" id="paintOnion" checked> Onion skin</label>
      <button class="btn" id="paintPrevF">◀ Frame</button>
      <button class="btn" id="paintNextF">Frame ▶</button>
    </div>
    <div class="hint" id="paintHint"></div>
  </div>
</section>

<!-- ============ MODALS ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="filePicker" class="hidden">

<script type="module" src="js/app.js"></script>
</body>
</html>
